# Dev services: the FastAPI app + a self-hosted SearXNG for search.
# PostgreSQL is NOT here — it's hosted externally; point DATABASE_URL (in .env) at it.
#
#   docker compose up -d --build        # first run / after changing backend code or deps
#   docker compose up -d --build api    # update just the API image after editing backend code
#   docker compose up -d                # start when nothing changed (reuses existing images)
#
# IMPORTANT: the api image is built from ./backend (no live mount), so you MUST pass
# --build to pick up backend code/migration changes — see the note on the `api` service.
# No Redis yet — it'll be added when we actually need a queue/scheduler.
services:
  # Self-hosted metasearch: free, no API key, aggregates many engines + YouTube.
  # Config lives in ./searxng/settings.yml (JSON API enabled, limiter off for local).
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    restart: unless-stopped

  api:
    # `build` BAKES the backend source into the image — there is no bind-mount, so
    # editing code or adding a migration does NOT update the running container.
    # Plain `up -d` / `restart` reuse the OLD image. To apply your changes, REBUILD:
    #   docker compose up -d --build api     # rebuild + restart just the API
    #   docker compose build --no-cache api  # if a stale layer needs a clean rebuild
    build: ./backend
    # Defaults to 8000; override the host port with API_PORT if it's taken, e.g.
    #   API_PORT=8010 docker compose up -d
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    # In-container overrides — the .env values target host-run uvicorn, but from
    # inside the container "localhost" is the container itself, so:
    #   - reach the sibling SearXNG by its compose service name
    #   - reach the host's local Ollama (RAG embeddings) via host-gateway
    # DATABASE_URL comes from .env; if your Postgres runs on the HOST (not a
    # remote host), set it to use host.docker.internal instead of localhost.
    environment:
      - SEARXNG_URL=http://searxng:8080
      - OLLAMA_EMBED_HOST=http://host.docker.internal:11434
      # Defaults to the host's Postgres via host.docker.internal (containers can't
      # use "localhost"). Override with a real hosted DB by setting DATABASE_URL in
      # .env or the shell — it wins over this default for both API and host runs.
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin@host.docker.internal:5432/student_journey}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    restart: unless-stopped
