# Local infra for development: PostgreSQL (with pgvector available for later RAG).
# Bring up with:  docker compose up -d
# No Redis yet — it'll be added when we actually need a queue/scheduler.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_journey
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_journey"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
